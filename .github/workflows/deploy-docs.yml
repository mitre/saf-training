name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        run: pnpm run docs:build
        env:
          # Sets the VitePress `base` to /saf-training/ for Pages.
          GITHUB_DEPLOY: "true"

      - name: Deploy Docs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: src/.vitepress/dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
